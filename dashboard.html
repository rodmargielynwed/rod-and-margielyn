<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP Dashboard · Rod &amp; Margielyn</title>
  <meta name="robots" content="noindex, nofollow" />
 
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet" />
 
  <style>
    /* ---- tokens (match main site) ---- */
    :root{
      --blue-50:#f3f8fc; --blue-100:#e3eff8; --blue-200:#cfe4f4; --blue-300:#a9cfe9;
      --blue-400:#7fb4da; --blue-600:#4a7ba6; --ink:#33475a;
      --white:#fff; --linen:#fbfcfe; --gold:#c9a24b; --gold-soft:#e6cf95; --gold-deep:#a5822f;
      --font-display:"Cormorant Garamond",Georgia,serif;
      --font-script:"Pinyon Script",cursive;
      --font-body:"Jost","Helvetica Neue",Arial,sans-serif;
      --radius:14px; --shadow:0 18px 50px -24px rgba(51,71,90,.35);
      --shadow-sm:0 8px 24px -14px rgba(51,71,90,.3);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font-body);font-weight:300;color:var(--ink);
      background:linear-gradient(180deg,var(--blue-50),var(--blue-100));min-height:100vh;line-height:1.6}
    h1,h2,h3{font-family:var(--font-display);color:var(--blue-600);margin:0}
    a{color:var(--gold-deep)}
 
    /* ---- gate ---- */
    .gate{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
    .gate__card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
      border-top:4px solid var(--gold-soft);padding:2.4rem 2rem;max-width:380px;width:100%;text-align:center}
    .gate__names{font-family:var(--font-script);font-size:2.6rem;color:var(--blue-600);line-height:1;margin-bottom:.3rem}
    .gate__sub{text-transform:uppercase;letter-spacing:.2em;font-size:.7rem;color:var(--gold-deep);margin-bottom:1.6rem}
    .gate input{width:100%;padding:.85rem 1rem;font-size:1rem;font-family:var(--font-body);
      border:1.5px solid var(--blue-200);border-radius:10px;background:var(--blue-50);text-align:center;letter-spacing:.1em}
    .gate input:focus{outline:none;border-color:var(--gold);background:var(--white);box-shadow:0 0 0 4px rgba(201,162,75,.15)}
    .gate__err{color:#c0574f;font-size:.85rem;min-height:1.1rem;margin:.6rem 0 0}
    .btn{display:inline-block;cursor:pointer;border:none;font-family:var(--font-body);font-size:.8rem;
      font-weight:500;text-transform:uppercase;letter-spacing:.15em;padding:.9em 2em;border-radius:100px;
      background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#4a3a10;
      box-shadow:0 12px 30px -12px rgba(165,130,47,.7);transition:transform .2s,box-shadow .2s;margin-top:1.2rem;width:100%}
    .btn:hover{transform:translateY(-2px)}
 
    /* ---- dashboard ---- */
    .dash{display:none;max-width:1000px;margin:0 auto;padding:1.5rem 1.1rem 4rem}
    .dash.is-on{display:block}
    .dash__head{text-align:center;padding:1.6rem 0 1.2rem}
    .dash__names{font-family:var(--font-script);font-size:2.6rem;color:var(--blue-600);line-height:1}
    .dash__title{text-transform:uppercase;letter-spacing:.25em;font-size:.72rem;color:var(--gold-deep);margin-top:.2rem}
 
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.9rem;margin-bottom:1.4rem}
    .stat{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-sm);
      border-top:3px solid var(--gold-soft);padding:1.3rem 1rem;text-align:center}
    .stat__num{font-family:var(--font-display);font-weight:600;font-size:2.6rem;color:var(--blue-600);line-height:1}
    .stat__label{text-transform:uppercase;letter-spacing:.12em;font-size:.66rem;color:var(--gold-deep);margin-top:.4rem}
    .stat--accept .stat__num{color:#3f8f6b}
    .stat--decline .stat__num{color:#b98a8a}
 
    .toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;margin-bottom:.9rem}
    .toolbar input{flex:1;min-width:160px;padding:.7rem .9rem;border:1.5px solid var(--blue-200);
      border-radius:10px;background:var(--white);font-family:var(--font-body);font-size:.95rem}
    .toolbar input:focus{outline:none;border-color:var(--gold)}
    .toolbar__btns{display:flex;gap:.5rem}
    .chip{cursor:pointer;border:1px solid var(--blue-200);background:var(--white);border-radius:100px;
      padding:.5em 1em;font-size:.78rem;font-family:var(--font-body);color:var(--ink);white-space:nowrap}
    .chip.is-active{background:var(--blue-600);color:var(--white);border-color:var(--blue-600)}
 
    .tablewrap{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    th,td{text-align:left;padding:.85rem .9rem;border-bottom:1px solid var(--blue-100);vertical-align:top}
    th{background:var(--blue-50);font-family:var(--font-body);font-weight:500;text-transform:uppercase;
      letter-spacing:.06em;font-size:.68rem;color:var(--blue-600)}
    tr:last-child td{border-bottom:none}
    .tag{display:inline-block;padding:.2em .7em;border-radius:100px;font-size:.72rem;white-space:nowrap}
    .tag--yes{background:#e5f3ec;color:#2f7d5b}
    .tag--no{background:#f6ecec;color:#a86a6a}
    .muted{color:var(--blue-400)}
    .status{text-align:center;padding:2rem 1rem;color:var(--blue-400)}
    .refresh{cursor:pointer;color:var(--gold-deep);font-size:.82rem;text-decoration:none;letter-spacing:.05em}
    .foot{text-align:center;margin-top:1.4rem;font-size:.78rem;color:var(--blue-400)}
    .foot a{cursor:pointer}
    @media (max-width:560px){
      /* On phones, hide email column to keep it readable */
      .col-email{display:none}
      .dash__names{font-size:2.2rem}
    }
      /* Allotment editable box */
    .allot-input{ width:64px; padding:.45rem .5rem; font-size:.95rem; text-align:center;
      border:1.5px solid var(--blue-200); border-radius:8px; background:var(--blue-50);
      color:var(--ink); font-family:var(--font-body); }
    .allot-input:focus{ outline:none; border-color:var(--gold); background:#fff;
      box-shadow:0 0 0 3px rgba(201,162,75,.18); }
    .allot-input.saved{ border-color:#3f8f6b; background:#eef7f1; }
  </style>
</head>
<body>
 
  <!-- ============ PASSWORD GATE ============ -->
  <div class="gate" id="gate">
    <div class="gate__card">
      <div class="gate__names">Rod &amp; Margielyn</div>
      <div class="gate__sub">RSVP Dashboard</div>
      <input type="password" id="pw" placeholder="Enter password" autocomplete="off" />
      <p class="gate__err" id="pwErr"></p>
      <button class="btn" id="enterBtn">View responses</button>
    </div>
  </div>
 
  <!-- ============ DASHBOARD ============ -->
  <div class="dash" id="dash">
    <div class="dash__head">
      <div class="dash__names">Rod &amp; Margielyn</div>
      <div class="dash__title">RSVP Dashboard</div>
    </div>
 
    <div class="stats">
      <div class="stat stat--accept"><div class="stat__num" id="sAttending">–</div><div class="stat__label">of 200 Seats Filled</div></div>
      <div class="stat"><div class="stat__num" id="sAllotted">–</div><div class="stat__label">of 200 Seats Allotted</div></div>
      <div class="stat"><div class="stat__num" id="sParties">–</div><div class="stat__label">Responses (Yes)</div></div>
      <div class="stat stat--decline"><div class="stat__num" id="sDeclined">–</div><div class="stat__label">Declined</div></div>
      <div class="stat"><div class="stat__num" id="sTotal">–</div><div class="stat__label">Total Replies</div></div>
    </div>
 
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search a name…" />
      <div class="toolbar__btns">
        <button class="chip is-active" data-filter="all">All</button>
        <button class="chip" data-filter="yes">Attending</button>
        <button class="chip" data-filter="no">Declined</button>
      </div>
    </div>
 
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>Name(s)</th>
            <th>Status</th>
            <th>Guests</th>
            <th>Allotted</th>
            <th class="col-email">Email</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="6" class="status" id="loadingRow">Loading responses…</td></tr>
        </tbody>
      </table>
    </div>
 
    <p class="foot">
      <a class="refresh" id="refresh">↻ Refresh</a> &nbsp;·&nbsp;
      <a class="foot" id="logout">Lock dashboard</a>
    </p>
  </div>
 
  <script>
  (function(){
    "use strict";
 
    /* =====================================================
       CONFIG — edit these two values
       ===================================================== */
    // 1) The SAME Google Apps Script /exec URL used by the RSVP form
    var ENDPOINT = "https://script.google.com/macros/s/AKfycbwfu2KVJLzcZcZa3IJs7At3_P9hcy_CIXdCEIeIGKA2PJCC1PL6em_MOe4quDbV2tvZww/exec";
    // 2) Your dashboard password (note: this is light protection, not bank-grade)
    var PASSWORD = "rodm1114";
    /* ===================================================== */
 
    var allRows = [];
    var activeFilter = "all";
 
    // ---- gate ----
    var gate = document.getElementById("gate");
    var dash = document.getElementById("dash");
    var pw = document.getElementById("pw");
    var pwErr = document.getElementById("pwErr");
 
    function unlock(){
      if(pw.value === PASSWORD){
        sessionStorage.setItem("rm_ok","1");
        gate.style.display="none";
        dash.classList.add("is-on");
        loadData();
      } else {
        pwErr.textContent = "Incorrect password. Try again.";
        pw.value=""; pw.focus();
      }
    }
    document.getElementById("enterBtn").addEventListener("click", unlock);
    pw.addEventListener("keydown", function(e){ if(e.key==="Enter") unlock(); });
 
    // stay unlocked while the tab is open
    if(sessionStorage.getItem("rm_ok")==="1"){
      gate.style.display="none"; dash.classList.add("is-on"); loadData();
    }
 
    document.getElementById("logout").addEventListener("click", function(){
      sessionStorage.removeItem("rm_ok"); location.reload();
    });
    document.getElementById("refresh").addEventListener("click", loadData);
 
    // ---- fetch data from Apps Script (GET returns JSON) ----
    function loadData(){
      var body = document.getElementById("rows");
      body.innerHTML = '<tr><td colspan="6" class="status">Loading responses…</td></tr>';
      fetch(ENDPOINT + "?action=list")
        .then(function(r){ return r.json(); })
        .then(function(data){
          allRows = Array.isArray(data) ? data : (data.rows || []);
          render();
        })
        .catch(function(err){
          body.innerHTML = '<tr><td colspan="6" class="status">Couldn\u2019t load responses. Check the endpoint URL, then tap Refresh.</td></tr>';
          console.error(err);
        });
    }
 
    // ---- filters ----
    document.querySelectorAll(".chip").forEach(function(c){
      c.addEventListener("click", function(){
        document.querySelectorAll(".chip").forEach(function(x){x.classList.remove("is-active");});
        c.classList.add("is-active");
        activeFilter = c.getAttribute("data-filter");
        render();
      });
    });
    document.getElementById("search").addEventListener("input", render);
 
    // Save allotment when an allotted box changes (writes back to the sheet)
    document.getElementById("rows").addEventListener("change", function(e){
      var el = e.target;
      if (!el.classList || !el.classList.contains("allot-input")) return;
      var row = el.getAttribute("data-row");
      var val = el.value;
      // reflect locally so the total updates instantly
      allRows.forEach(function(r){ if (String(r.row)===String(row)) r.allotted = val; });
      render();
      // persist to the sheet (fire-and-forget, no-cors)
      var body = new URLSearchParams({ action:"setAllotment", row:row, allotted:val }).toString();
      fetch(ENDPOINT, { method:"POST", mode:"no-cors",
        headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body:body })
        .then(function(){ el.classList.add("saved"); setTimeout(function(){ el.classList.remove("saved"); }, 900); })
        .catch(function(err){ console.error(err); });
    });
 
    function isYes(v){ return String(v||"").toLowerCase().indexOf("accept")>-1 || String(v||"").toLowerCase()==="yes"; }
 
    function render(){
      var q = document.getElementById("search").value.trim().toLowerCase();
      var body = document.getElementById("rows");
 
      // stats
      var attendingGuests=0, yesParties=0, declined=0;
      allRows.forEach(function(r){
        if(isYes(r.attendance)){ yesParties++; attendingGuests += (parseInt(r.attendees,10)||0); }
        else { declined++; }
      });
      var attEl = document.getElementById("sAttending");
      attEl.textContent = attendingGuests + " / 200";
      if (attendingGuests >= 200)      attEl.style.color = "#c0574f";
      else if (attendingGuests >= 180) attEl.style.color = "#c9a24b";
      else                             attEl.style.color = "#3f8f6b";
      // total of all allotted numbers, against 200
      var allottedTotal = 0;
      allRows.forEach(function(r){ allottedTotal += (parseInt(r.allotted,10)||0); });
      var alEl = document.getElementById("sAllotted");
      if (alEl){
        alEl.textContent = allottedTotal + " / 200";
        if (allottedTotal >= 200)      alEl.style.color = "#c0574f";
        else if (allottedTotal >= 180) alEl.style.color = "#c9a24b";
        else                           alEl.style.color = "#3f8f6b";
      }
      document.getElementById("sParties").textContent = yesParties;
      document.getElementById("sDeclined").textContent = declined;
      document.getElementById("sTotal").textContent = allRows.length;
 
      // rows (newest first)
      var list = allRows.slice().reverse().filter(function(r){
        var yes = isYes(r.attendance);
        if(activeFilter==="yes" && !yes) return false;
        if(activeFilter==="no" && yes) return false;
        if(q && String(r.guestName||"").toLowerCase().indexOf(q)===-1) return false;
        return true;
      });
 
      if(!list.length){
        body.innerHTML = '<tr><td colspan="6" class="status">No responses yet.</td></tr>';
        return;
      }
 
      body.innerHTML = list.map(function(r){
        var yes = isYes(r.attendance);
        var tag = yes ? '<span class="tag tag--yes">Attending</span>' : '<span class="tag tag--no">Declined</span>';
        var guests = yes ? (r.attendees||"—") : "—";
        var notes = r.notes ? escapeHtml(r.notes) : '<span class="muted">—</span>';
        return "<tr>"
          + "<td>"+escapeHtml(r.guestName||"—")+"</td>"
          + "<td>"+tag+"</td>"
          + "<td>"+escapeHtml(String(guests))+"</td>"
          + '<td><input class="allot-input" type="number" min="0" max="20" inputmode="numeric" '
              + 'value="'+escapeHtml(String(r.allotted||""))+'" '
              + 'data-row="'+escapeHtml(String(r.row||""))+'" placeholder="–"></td>'
          + '<td class="col-email">'+escapeHtml(r.email||"—")+"</td>"
          + "<td>"+notes+"</td>"
          + "</tr>";
      }).join("");
    }
 
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g,function(c){
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
      });
    }
  })();
  </script>
</body>
</html>
